<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17233c"><title>Rapid Capture V1.2</title><style>
:root{--navy:#17233c;--navy2:#233354;--bg:#eef1f5;--card:#fff;--text:#18202b;--muted:#667085;--line:#d6dbe4;--blue:#275dad;--red:#a92e39;--green:#147447;--amber:#a35d00;--shadow:0 6px 20px rgba(20,31,52,.12)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:760px;min-height:100dvh;margin:auto;background:var(--card)}header{position:sticky;top:0;z-index:10;padding:max(12px,env(safe-area-inset-top)) 12px 9px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}.head{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:9px}.logo{width:34px;height:34px;border-radius:11px;background:var(--navy);color:white;display:grid;place-items:center;font-weight:900}h1{margin:0;font-size:16px}.sub{font-size:10px;color:var(--muted);margin-top:1px}.icon{width:42px;height:42px;border:0;border-radius:13px;background:transparent;color:var(--text);font-size:19px}main{padding:0 10px calc(64px + env(safe-area-inset-bottom))}.week{margin-bottom:7px}.week h2{position:sticky;top:57px;z-index:5;margin:0;padding:8px 2px 5px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);font-size:10px;letter-spacing:.13em;color:var(--muted)}.row{width:100%;min-height:39px;padding:0 2px;display:grid;grid-template-columns:32px 43px minmax(0,1fr) 14px;align-items:center;gap:5px;border:0;border-bottom:1px solid var(--line);background:transparent;color:inherit;text-align:left}.day,.time{font-size:10.5px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}.time{text-align:right}.title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.arrow{font-size:17px;color:var(--muted);text-align:right}.bar{position:fixed;left:50%;bottom:0;z-index:20;transform:translateX(-50%);width:min(100%,760px);display:grid;grid-template-columns:30% 30% 40%;gap:6px;padding:7px 10px max(7px,env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid var(--line);box-shadow:0 -5px 18px rgba(20,31,52,.09)}.bar button{min-height:44px;border:0;border-radius:13px;background:transparent;color:var(--text);font-weight:800}.bar .capture{background:var(--navy);color:#fff}.dot{display:none;width:5px;height:5px;border-radius:50%;background:var(--blue);vertical-align:top;margin-left:3px}.dot.on{display:inline-block}.overlay{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;background:rgba(12,22,38,.45)}.overlay.open{display:flex}.sheet{width:min(100%,540px);max-height:92dvh;overflow:auto;background:var(--bg);padding:16px 18px max(18px,env(safe-area-inset-bottom));border-radius:25px 25px 0 0}.sheethead{display:flex;align-items:center;justify-content:space-between}.sheet h2{margin:0;font-size:19px}label{display:block;margin:13px 0 5px;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase}.field,textarea,select,input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--text);font:inherit;font-size:16px}textarea{min-height:105px;resize:vertical}.grid{display:grid;gap:0 10px}.primary{width:100%;min-height:48px;margin-top:15px;border:0;border-radius:15px;background:var(--navy);color:#fff;font-weight:800}.danger{width:100%;min-height:42px;margin-top:6px;border:0;background:transparent;color:var(--red);font-weight:800}.searchpop{position:fixed;z-index:30;left:50%;bottom:calc(58px + max(7px,env(safe-area-inset-bottom)));transform:translateX(-50%);width:min(calc(100% - 20px),740px);display:none;gap:6px;padding:8px;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:var(--shadow)}.searchpop.open{display:flex}.searchpop .field{min-width:0}.close{width:44px;border:0;border-radius:12px;background:var(--bg);font-size:20px}.filters{display:grid;gap:5px;margin-top:14px}.filters button{min-height:44px;padding:0 13px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--text);text-align:left;font-weight:700}.filters button.active{background:var(--navy);color:#fff}.empty{padding:45px 15px;text-align:center;color:var(--muted)}.settings{display:grid;gap:8px;margin-top:14px}.settings button{min-height:44px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--text);font-weight:700}@media(min-width:600px){.overlay{align-items:center}.sheet{border-radius:25px}.grid{grid-template-columns:1fr 1fr}}
</style></head><body><div class="app"><header><div class="head"><div class="brand"><div class="logo">+</div><div><h1>Rapid Capture</h1><div class="sub">Keep what matters</div></div></div><button class="icon" id="settings">⚙</button></div></header><main id="list"></main></div>
<div class="searchpop" id="searchPop"><input class="field" id="searchInput" placeholder="Search captures…"><button class="close" id="searchClose">×</button></div>
<div class="bar"><button id="filterBtn">≡ Filter<span id="dot" class="dot"></span></button><button id="searchBtn">⌕ Search</button><button class="capture" id="captureBtn">＋ Capture</button></div>
<div class="overlay" id="formOverlay"><div class="sheet"><div class="sheethead"><div><h2 id="formTitle">New Capture</h2><div class="sub">Save it now. Organise only if useful.</div></div><button class="close" data-close="formOverlay">×</button></div><label>What's worth remembering?</label><textarea id="text" maxlength="5000"></textarea><div class="grid"><div><label>Source</label><input id="source" class="field"></div><div><label>Category</label><select id="category"></select></div></div><label>Follow up</label><input type="date" id="follow"><button class="primary" id="save">Save Capture</button><button class="danger" id="delete" hidden>Delete Capture</button></div></div>
<div class="overlay" id="filterOverlay"><div class="sheet"><div class="sheethead"><h2>Filter</h2><button class="close" data-close="filterOverlay">×</button></div><div class="filters" id="filterChoices"></div></div></div>
<div class="overlay" id="settingsOverlay"><div class="sheet"><div class="sheethead"><div><h2>Settings & Data</h2><div class="sub">Rapid Capture V1.2</div></div><button class="close" data-close="settingsOverlay">×</button></div><div class="settings"><button id="addCat">+ Add category</button><button id="export">Export JSON backup</button><button id="import">Import JSON backup</button><input id="file" type="file" accept=".json,application/json" hidden></div></div></div>
<script>
(()=>{'use strict';const KEY='rapid-capture-v1-html',cats0=['Home','Technology','Shopping','Travel','Health','Finance','Work','Personal'];const $=s=>document.querySelector(s);let edit=null,filter='all';const uid=(p='cap')=>p+'_'+(crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random());function fresh(){return{schemaVersion:1,revision:0,captures:[],categories:cats0.map((name,order)=>({id:uid('cat'),name,order})),settings:{theme:'system'}}}let data;try{data=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{data=fresh()}function persist(){data.revision=(data.revision||0)+1;localStorage.setItem(KEY,JSON.stringify(data));render()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function ws(d){let x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}function wk(d){return ws(d).toISOString().slice(0,10)}function wl(d){let w=ws(d),n=ws(new Date());if(+w===+n)return'THIS WEEK';let e=new Date(w);e.setDate(e.getDate()+6);let m=x=>new Intl.DateTimeFormat(undefined,{month:'short'}).format(x).toUpperCase();return w.getMonth()===e.getMonth()?`${w.getDate()}–${e.getDate()} ${m(e)}${e.getFullYear()!==new Date().getFullYear()?' '+e.getFullYear():''}`:`${w.getDate()} ${m(w)} – ${e.getDate()} ${m(e)} ${e.getFullYear()}`}function dt(x){let d=new Date(x);return[new Intl.DateTimeFormat(undefined,{weekday:'short'}).format(d),new Intl.DateTimeFormat(undefined,{hour:'2-digit',minute:'2-digit',hour12:false}).format(d)]}function open(id){$('#'+id).classList.add('open')}function close(id){$('#'+id).classList.remove('open')}function opts(){category.innerHTML='<option value="">None</option>'+data.categories.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}function filters(){filterChoices.innerHTML=[['all','All categories'],['none','Uncategorised'],...data.categories.map(c=>[c.id,c.name])].map(([id,n])=>`<button class="${filter===id?'active':''}" data-f="${esc(id)}">${esc(n)}</button>`).join('');document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;close('filterOverlay');render()})}function render(){opts();filters();dot.classList.toggle('on',filter!=='all');let q=searchInput.value.trim().toLowerCase(),map=Object.fromEntries(data.categories.map(c=>[c.id,c.name])),a=[...data.captures].filter(c=>(!q||(c.text+' '+(c.source||'')+' '+(map[c.categoryId]||'')).toLowerCase().includes(q))&&(filter==='all'||(filter==='none'?!c.categoryId:c.categoryId===filter))).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));if(!a.length){list.innerHTML=`<div class="empty">${data.captures.length?'No captures found.':'Nothing captured yet. Tap Capture to save something worth remembering.'}</div>`;return}let gs=[];for(let c of a){let k=wk(c.createdAt),g=gs.find(x=>x.k===k);if(!g){g={k,d:new Date(c.createdAt),a:[]};gs.push(g)}g.a.push(c)}list.innerHTML=gs.map(g=>`<section class="week"><h2>${esc(wl(g.d))}</h2>${g.a.map(c=>{let [d,t]=dt(c.createdAt);return`<button class="row" data-id="${esc(c.id)}"><span class="day">${esc(d)}</span><span class="time">${esc(t)}</span><span class="title">${esc(c.text)}</span><span class="arrow">›</span></button>`}).join('')}</section>`).join('');document.querySelectorAll('.row').forEach(b=>b.onclick=()=>form(data.captures.find(c=>c.id===b.dataset.id)))}function form(c=null){edit=c;formTitle.textContent=c?'Edit Capture':'New Capture';text.value=c?.text||'';source.value=c?.source||'';category.value=c?.categoryId||'';follow.value=c?.followUpDate||'';$('#delete').hidden=!c;open('formOverlay');setTimeout(()=>text.focus(),80)}captureBtn.onclick=()=>form();searchBtn.onclick=()=>{searchPop.classList.add('open');setTimeout(()=>searchInput.focus(),50)};searchClose.onclick=()=>searchPop.classList.remove('open');searchInput.oninput=render;filterBtn.onclick=()=>{filters();open('filterOverlay')};settings.onclick=()=>open('settingsOverlay');document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>close(b.dataset.close));save.onclick=()=>{let v=text.value.trim();if(!v)return alert('Enter something to capture.');let now=new Date().toISOString(),o={text:v,source:source.value.trim(),categoryId:category.value||null,followUpDate:follow.value||null};if(edit)data.captures=data.captures.map(c=>c.id===edit.id?{...c,...o,updatedAt:now}:c);else data.captures.push({id:uid(),...o,createdAt:now,updatedAt:now});persist();close('formOverlay')};$('#delete').onclick=()=>{if(edit&&confirm('Delete this capture?')){data.captures=data.captures.filter(c=>c.id!==edit.id);persist();close('formOverlay')}};addCat.onclick=()=>{let n=prompt('New category name')?.trim();if(n&&!data.categories.some(c=>c.name.toLowerCase()===n.toLowerCase())){data.categories.push({id:uid('cat'),name:n,order:data.categories.length});persist()}};$('#export').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='rapid-capture-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),500)};$('#import').onclick=()=>$('#file').click();$('#file').onchange=async()=>{try{let x=JSON.parse(await $('#file').files[0].text());if(!Array.isArray(x.captures)||!Array.isArray(x.categories))throw Error();if(confirm('Replace current data with this backup?')){data=x;persist();close('settingsOverlay')}}catch{alert('Invalid backup file.')}$('#file').value=''};render()})();
</script><script>if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));</script></body></html>
