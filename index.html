:root{--navy:#17233c;--navy2:#233354;--bg:#eef1f5;--card:#fff;--text:#18202b;--muted:#667085;--line:#d6dbe4;--blue:#275dad;--red:#a92e39;--green:#147447;--amber:#a35d00;--shadow:0 6px 20px rgba(20,31,52,.12)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:760px;min-height:100dvh;margin:auto;background:var(--card)}header{position:sticky;top:0;z-index:10;padding:max(12px,env(safe-area-inset-top)) 12px 9px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}.head{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:9px}.logo{width:34px;height:34px;border-radius:11px;overflow:hidden;display:block;background:var(--navy);box-shadow:0 2px 7px rgba(20,31,52,.14)}.logo img{display:block;width:100%;height:100%;object-fit:cover}h1{margin:0;font-size:16px}.sub{font-size:10px;color:var(--muted);margin-top:1px}.header-actions{display:flex;align-items:center;gap:1px}.icon{width:38px;height:38px;border:0;border-radius:12px;background:transparent;color:var(--text);font-size:18px;display:grid;place-items:center}.icon.active{background:#edf4ff;color:var(--blue)}main{padding:0 10px calc(64px + env(safe-area-inset-bottom))}.week{margin-bottom:7px}.week h2{position:sticky;top:57px;z-index:5;margin:0;padding:8px 2px 5px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);font-size:10px;letter-spacing:.13em;color:var(--muted)}.row{width:100%;min-height:37px;padding:0 4px;display:grid;grid-template-columns:49px minmax(0,1fr) 14px;align-items:center;gap:6px;border:0;border-bottom:1px solid var(--line);background:transparent;color:inherit;text-align:left}.row.important{background:#fff4dc;border-radius:8px;border-bottom-color:#ebd49e}.datebadge{display:flex;align-items:baseline;gap:4px;width:49px;font-variant-numeric:tabular-nums;white-space:nowrap}.datenum{font-size:11.5px;color:var(--text);font-weight:800;letter-spacing:.01em}.dateday{font-size:9.5px;color:var(--muted);font-weight:600}.title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.arrow{font-size:17px;color:var(--muted);text-align:right}.bar{position:fixed;left:50%;bottom:0;z-index:20;transform:translateX(-50%);width:min(100%,760px);display:flex;justify-content:center;padding:7px 10px max(7px,env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid var(--line);box-shadow:0 -5px 18px rgba(20,31,52,.09)}.bar .capture{width:min(88%,620px);min-height:46px;border:0;border-radius:14px;background:var(--navy);color:#fff;font-weight:850;font-size:13px}.dot{display:none;width:5px;height:5px;border-radius:50%;background:var(--blue);vertical-align:top;margin-left:3px}.dot.on{display:inline-block}.overlay{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;background:rgba(12,22,38,.45)}.overlay.open{display:flex}.sheet{width:min(100%,540px);max-height:92dvh;overflow:auto;background:var(--bg);padding:16px 18px max(18px,env(safe-area-inset-bottom));border-radius:25px 25px 0 0}.sheethead{display:flex;align-items:center;justify-content:space-between}.sheet h2{margin:0;font-size:19px}label{display:block;margin:13px 0 5px;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase}.field,textarea,select,input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--text);font:inherit;font-size:16px}textarea{min-height:88px;resize:vertical}.grid{display:grid;gap:0 10px}.compact-meta{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:end}.follow-wrap{position:relative;min-width:0}.follow-control{width:100%;height:44px;min-width:0;padding:0 10px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:6px;font:inherit;font-size:12px;font-weigh <div class="overlay" id="formOverlay"><div class="sheet capture-sheet" id="captureSheet"><div class="sheethead"><div><h2 id="formTitle">New Capture</h2><div class="sub">Save it now. Organise only if useful.</div></div><button class="close" data-close="formOverlay">×</button></div><label class="capture-primary-label">What's worth remembering?</label><textarea id="text" maxlength="5000" rows="3" placeholder="Idea, recommendation or useful information…"></textarea><button type="button" class="capture-more-toggle" id="moreInfoToggle" aria-expanded="false"><span id="moreInfoLabel">＋ Capture more info</span><span class="chev">⌄</span></button><div class="more-info" id="moreInfo"><label>Source</label><input id="source" class="field" placeholder="Person, website, podcast…"><div class="compact-meta"><div><label>Category</label><select id="category"></select></div><div class="follow-wrap" id="followWrap"><label>Next follow-up date</label><button type="button" class="follow-control" id="followButton" aria-label="Choose next follow-up date"><span class="follow-value" id="followValue">Select date</span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="15" rx="2"></rect><path d="M7 3.5v4M17 3.5v4M3.5 9.5h17"></path></svg></button><button type="button" class="follow-clear" id="followClear" aria-label="Clear next follow-up date">×</button><input class="follow-native" type="date" id="follow" aria-label="Next follow-up date" tabindex="-1"></div></div><label class="important-toggle"><input type="checkbox" id="important"> Important</label></div><button class="primary" id="save">Save Capture</button><button class="danger" id="delete" hidden>Delete Capture</button></div></div>
<div class="overlay" id="filterOverlay"><div class="sheet"><div class="sheethead"><h2>Filter</h2><button class="close" data-close="filterOverlay">×</button></div><div class="filters" id="filterChoices"></div></div></div>
<div class="overlay" id="settingsOverlay"><div class="sheet"><div class="sheethead"><div><h2>Settings & Data</h2><div class="sub">Rapid Capture V2.1</div></div><button class="close" data-close="settingsOverlay">×</button></div><div class="settings"><button id="addCat">+ Add category</button><button id="export">Export JSON backup</button><button id="import">Import JSON backup</button><input id="file" type="file" accept=".json,application/json" hidden></div></div></div>
<script>
(()=>{'use strict';const KEY='rapid-capture-v1-html',cats0=['Home','Technology','Shopping','Travel','Health','Finance','Work','Personal'];const $=s=>document.querySelector(s);let edit=null,filter='all';const uid=(p='cap')=>p+'_'+(crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random());function fresh(){return{schemaVersion:1,revision:0,captures:[],categories:cats0.map((name,order)=>({id:uid('cat'),name,order})),settings:{theme:'system'}}}let data;try{data=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{data=fresh()}function persist(){data.revision=(data.revision||0)+1;localStorage.setItem(KEY,JSON.stringify(data));render()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function ws(d){let x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}function wk(d){return ws(d).toISOString().slice(0,10)}function wl(d){let w=ws(d),n=ws(new Date());if(+w===+n)return'THIS WEEK';let e=new Date(w);e.setDate(e.getDate()+6);let m=x=>new Intl.DateTimeFormat(undefined,{month:'short'}).format(x).toUpperCase();return w.getMonth()===e.getMonth()?`${w.getDate()}–${e.getDate()} ${m(e)}${e.getFullYear()!==new Date().getFullYear()?' '+e.getFullYear():''}`:`${w.getDate()} ${m(w)} – ${e.getDate()} ${m(e)} ${e.getFullYear()}`}function dt(x){let d=new Date(x);return[String(d.getDate()).padStart(2,'0'),new Intl.DateTimeFormat(undefined,{weekday:'short'}).format(d)]}function open(id){$('#'+id).classList.add('open')}function close(id){$('#'+id).classList.remove('open')}function opts(){category.innerHTML='<option value="">None</option>'+data.categories.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}function filters(){filterChoices.innerHTML=[['all','All categories'],['none','Uncategorised'],...data.categories.map(c=>[c.id,c.name])].map(([id,n])=>`<button class="${filter===id?'active':''}" data-f="${esc(id)}">${esc(n)}</button>`).join('');document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;close('filterOverlay');render()})}function hi(text,q){if(!q)return esc(text);let raw=String(text??''),low=raw.toLowerCase(),needle=q.toLowerCase(),pos=0,out='';while(true){let i=low.indexOf(needle,pos);if(i<0){out+=esc(raw.slice(pos));break}out+=esc(raw.slice(pos,i))+'<span class="match">'+esc(raw.slice(i,i+needle.length))+'</span>';pos=i+needle.length}return out}
function searchReason(c,q,map){if(!q)return'';let z=q.toLowerCase();if((c.text||'').toLowerCase().includes(z))return'';if((c.source||'').toLowerCase().includes(z))return'Source: '+c.source;let cat=map[c.categoryId]||'';if(cat.toLowerCase().includes(z))return'Category: '+cat;return''}
function render(){opts();filters();dot.classList.toggle('on',filter!=='all');searchInput.value='';let rawQ=instantSearch.value, q=rawQ.trim().toLowerCase(),map=Object.fromEntries(data.categories.map(c=>[c.id,c.name])),a=[...data.captures].filter(c=>(!q||(c.text+' '+(c.source||'')+' '+(map[c.categoryId]||'')).toLowerCase().includes(q))&&(filter==='all'||(filter==='none'?!c.categoryId:c.categoryId===filter))).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
if(document.querySelector('.head').classList.contains('searching')){if(!q){list.innerHTML='<div class="search-empty"><strong>Search captures</strong><span>Type a title, source or category.</span></div>';return}if(!a.length){list.innerHTML=`<div class="search-count">0 RESULTS</div><div class="search-empty"><strong>No results</strong><span>No captures match “${esc(rawQ.trim())}”.</span></div>`;return}list.innerHTML=`<div class="search-count">${a.length} ${a.length===1?'RESULT':'RESULTS'}</div>`+a.map(c=>{let [d,w]=dt(c.createdAt),reason=searchReason(c,q,map);return`<button class="row search-result ${reason?'has-meta':''} ${c.important===true?'important':''}" data-id="${esc(c.id)}"><span class="datebadge"><span class="datenum">${esc(d)}</span><span class="dateday">${esc(w)}</span></span><span class="title">${hi(c.text,q)}</span><span class="arrow">›</span>${reason?`<span class="search-meta">${hi(reason,q)}</span>`:''}</button>`}).join('');document.querySelectorAll('.row').forEach(x=>x.onclick=()=>form(data.captures.find(c=>c.id===x.dataset.id)));return}
if(!a.length){list.innerHTML=`<div class="empty">${data.captures.length?'No captures found.':'Nothing captured yet. Tap Capture to save something worth remembering.'}</div>`;return}let gs=[];for(let c of a){let k=wk(c.createdAt),g=gs.find(x=>x.k===k);if(!g){g={k,d:new Date(c.createdAt),a:[]};gs.push(g)}g.a.push(c)}list.innerHTML=gs.map(g=>`<section class="week"><h2>${esc(wl(g.d))}</h2>${g.a.map(c=>{let [d,w]=dt(c.createdAt);return`<button class="row ${c.important===true?'important':''}" data-id="${esc(c.id)}"><span class="datebadge"><span class="datenum">${esc(d)}</span><span class="dateday">${esc(w)}</span></span><span class="title">${esc(c.text)}</span><span class="arrow">›</span></button>`}).join('')}</section>`).join('');document.querySelectorAll('.row').forEach(x=>x.onclick=()=>form(data.captures.find(c=>c.id===x.dataset.id)))}
function hasMoreInfo(){return!!(source.value.trim()||category.value||follow.value||important.checked)}function setMoreInfo(open){moreInfo.classList.toggle('open',open);moreInfoToggle.setAttribute('aria-expanded',String(open));let added=hasMoreInfo();moreInfoLabel.textContent=open?'− Less info':(added?'✓ More info added':'＋ Capture more info');moreInfoToggle.classList.toggle('more-info-summary',!open&&added)}function growText(){text.style.height='auto';text.style.height=Math.min(Math.max(text.scrollHeight,76),190)+'px'}function form(c=null){edit=c;formTitle.textContent=c?'Edit Capture':'New Capture';text.value=c?.text||'';source.value=c?.source||'';category.value=c?.categoryId||'';follow.value=c?.followUpDate||'';syncFollowUI();important.checked=c?.important===true;$('#delete').hidden=!c;captureSheet.classList.toggle('editing',!!c);setMoreInfo(!!c);growText();open('formOverlay');setTimeout(()=>text.focus(),80)}function formatFollowDate(v){if(!v)return'Select date';let a=v.split('-').map(Number),d=new Date(a[0],a[1]-1,a[2]);return new Intl.DateTimeFormat(undefined,{day:'2-digit',month:'short',year:'numeric'}).format(d)}function syncFollowUI(){followWrap.classList.toggle('has-date',!!follow.value);followValue.textContent=formatFollowDate(follow.value)}followButton.onclick=()=>{if(matchMedia('(hover:none),(pointer:coarse)').matches)return;try{if(typeof follow.showPicker==='function')follow.showPicker();else{follow.focus();follow.click()}}catch(_){follow.focus();follow.click()}};followClear.onclick=e=>{e.preventDefault();e.stopPropagation();follow.value='';syncFollowUI()};follow.onchange=syncFollowUI;moreInfoToggle.onclick=()=>setMoreInfo(!moreInfo.classList.contains('open'));text.addEventListener('input',growText);[source,category,follow,important].forEach(el=>el.addEventListener('change',()=>{if(!moreInfo.classList.contains('open'))setMoreInfo(false)}));captureBtn.onclick=()=>form();let searchScroll=0;function enterSearch(){searchScroll=scrollY;document.querySelector('.head').classList.add('searching');instantSearch.value='';render();setTimeout(()=>instantSearch.focus(),40)}function leaveSearch(){instantSearch.value='';document.querySelector('.head').classList.remove('searching');instantSearch.blur();render();requestAnimationFrame(()=>scrollTo(0,searchScroll))}searchBtn.onclick=enterSearch;exitSearch.onclick=leaveSearch;instantSearch.oninput=render;filterBtn.onclick=()=>{filters();open('filterOverlay')};settings.onclick=()=>open('settingsOverlay');document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>close(b.dataset.close));save.onclick=()=>{let v=text.value.trim();if(!v)return alert('Enter something to capture.');let now=new Date().toISOString(),o={text:v,source:source.value.trim(),categoryId:category.value||null,followUpDate:follow.value||null,important:important.checked===true};if(edit)data.captures=data.captures.map(c=>c.id===edit.id?{...c,...o,updatedAt:now}:c);else data.captures.push({id:uid(),...o,createdAt:now,updatedAt:now});persist();close('formOverlay')};$('#delete').onclick=()=>{if(edit&&confirm('Delete this capture?')){data.captures=data.captures.filter(c=>c.id!==edit.id);persist();close('formOverlay')}};addCat.onclick=()=>{let n=prompt('New category name')?.trim();if(n&&!data.categories.some(c=>c.name.toLowerCase()===n.toLowerCase())){data.categories.push({id:uid('cat'),name:n,order:data.categories.length});persist()}};$('#export').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='rapid-capture-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),500)};$('#import').onclick=()=>$('#file').click();$('#file').onchange=async()=>{try{let x=JSON.parse(await $('#file').files[0].text());if(!Array.isArray(x.captures)||!Array.isArray(x.categories))throw Error();if(confirm('Replace current data with this backup?')){data=x;persist();close('settingsOverlay')}}catch{alert('Invalid backup file.')}$('#file').value=''};render()})();
</script><script>
/* V1.7 automatic PWA update detection */
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  let updateReloading = false;
  const activateWaitingWorker = registration => {
    if (registration.waiting) registration.waiting.postMessage({ type: 'SKIP_WAITING' });
  };
  const checkForUpdate = registration => registration.update().then(() => activateWaitingWorker(registration)).catch(() => {});
  addEventListener('load', async () => {
    try {
      const registration = await navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'none' });
      activateWaitingWorker(registration);
      registration.addEventListener('updatefound', () => {
        const worker = registration.installing;
        if (!worker) return;
        worker.addEventListener('statechange', () => {
          if (worker.state === 'installed' && navigator.serviceWorker.controller) activateWaitingWorker(registration);
        });
      });
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (updateReloading) return;
        updateReloading = true;
        location.reload();
      });
      checkForUpdate(registration);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') checkForUpdate(registration);
      });
      addEventListener('focus', () => checkForUpdate(registration));
      setInterval(() => checkForUpdate(registration), 30 * 60 * 1000);
    } catch (_) {}
  });
}
</script></body></html>
