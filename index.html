*{box-sizing:border-box}html{background:var(--bg);color-scheme:light}html[data-theme="dark"]{color-scheme:dark}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}.app{width:min(100%,760px);min-height:100dvh;margin:auto;background:var(--panel);box-shadow:var(--shadow)}

main{padding:16px 16px max(32px,env(safe-area-inset-bottom))}.primary{width:100%;min-height:54px;border:0;border-radius:18px;background:var(--navy);color:#fff;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 9px 22px rgba(11,31,58,.20)}.primary:active{transform:scale(.995)}.toolbar{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:14px}.field,.select,textarea,input{font:inherit}.field,.select,textarea,input[type=text],input[type=date]{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:16px;padding:13px 14px;font-size:16px;outline:none}.field:focus,.select:focus,textarea:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}.searchwrap{position:relative}.searchwrap .field{padding-left:42px;padding-right:42px}.searchicon{position:absolute;left:14px;top:13px;color:var(--muted)}.clearsearch{position:absolute;right:7px;top:7px}.select{font-size:13px;font-weight:700;max-width:170px}.sectionhead{display:flex;align-items:end;justify-content:space-between;margin:22px 0 7px}.eyebrow{font-size:11px;color:var(--muted);font-weight:850;letter-spacing:.15em}.count{font-size:12px;color:var(--muted);margin-top:4px}.link{border:0;background:transparent;color:var(--accent);font-weight:750;cursor:pointer}.list{border-top:1px solid transparent}.row{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:15px 0;cursor:pointer;color:inherit}.rowtitle{font-size:15px;font-weight:800;line-height:1.4;white-space:pre-line;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}.meta{font-size:12px;color:var(--muted);font-weight:650;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rowfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:11px;color:var(--muted)}.follow{color:var(--accent);font-weight:750}.empty{margin-top:40px;padding:42px 20px;text-align:center;border:1px dashed var(--line);border-radius:24px}.emptyicon{width:54px;height:54px;display:grid;place-items:center;margin:auto;border-radius:17px;background:var(--soft);color:var(--navy);font-size:26px}.empty h2{font-size:18px;margin:14px 0 7px}.empty p{font-size:14px;color:var(--muted);line-height:1.55;margin:0 auto 16px;max-width:380px}
.overlay{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(2,12,25,.52);backdrop-filter:blur(2px)}.overlay.open{display:flex}.sheet{width:min(100%,560px);max-height:92dvh;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 20px max(20px,env(safe-area-inset-bottom));box-shadow:0 -18px 50px rgba(0,0,0,.24)}.grab{width:48px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 14px}.sheethead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.sheet h2{margin:0;font-size:20px}.sub{font-size:12px;color:var(--muted);margin-top:3px}.close{background:var(--line)}label{display:block;font-size:11px;font-weight:850;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px}textarea{min-height:112px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr;gap:0 12px}.stamp{margin-top:14px;border-radius:15px;background:var(--soft);padding:12px;font-size:12px;color:var(--muted)}.save{margin-top:18px}.danger{width:100%;min-height:44px;border:0;background:transparent;color:var(--danger);font-weight:800;margin-top:7px;cursor:pointer}.error{font-size:13px;color:var(--danger);font-weight:700;margin-top:7px}.settingscard{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:15px;margin-top:11px}.settingscard h3{margin:0 0 12px;font-size:14px}.themegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.choice,.secondary{min-height:46px;border:1px solid var(--line);background:var(--soft);color:var(--text);border-radius:14px;font-weight:750;cursor:pointer}.choice.active{background:var(--navy);color:#fff;border-color:var(--navy)}.datagrid{display:grid;gap:8px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border-radius:99px;padding:7px 8px 7px 12px;font-size:12px;font-weight:750}.chip button{border:0;background:transparent;color:var(--muted);font-size:16px;cursor:pointer}.addcat{margin-bottom:10px}.toast{position:fixed;z-index:80;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:#06101f;color:#fff;border-radius:99px;padding:11px 18px;font-size:13px;font-weight:800;transition:.2s;pointer-events:none}.toast.show{transform:translate(-50%,0);opacity:1}
@media(min-width:600px){header{padding-left:24px;padding-right:24px}main{padding-left:24px;padding-right:24px}.overlay{align-items:center}.sheet{border-radius:28px}.grid2{grid-template-columns:1fr 1fr}.datagrid{grid-template-columns:1fr 1fr}.grab{display:none}}
</style>
</head>
<body>
<div class="app">
<header><div class="head"><div class="brand"><div class="logo">+</div><div><h1>Rapid Capture</h1><div class="tagline">Keep what matters</div></div></div><button class="iconbtn" id="settingsBtn" aria-label="Settings">⚙</button></div></header>
<main>
<button class="primary" id="quickBtn">＋ Quick Capture</button>
<div class="toolbar"><div class="searchwrap"><span class="searchicon">⌕</span><input class="field" id="search" placeholder="Search captures…" aria-label="Search captures"><button class="iconbtn clearsearch" id="clearSearch" aria-label="Clear search" hidden>×</button></div><select class="select" id="filter" aria-label="Filter by category"></select></div>
<div class="sectionhead"><div><div class="eyebrow" id="listLabel">RECENT</div><div class="count" id="count"></div></div><button class="link" id="clearFilters" hidden>Clear filters</button></div>
<div id="list"></div>
</main></div>

<div class="overlay" id="captureOverlay"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="formTitle"><div class="grab"></div><div class="sheethead"><div><h2 id="formTitle">New Capture</h2><div class="sub" id="formSub">Save it now. Organise only if useful.</div></div><button class="iconbtn close" id="closeCapture" aria-label="Close">×</button></div>
<label for="captureText">What’s worth remembering?</label><textarea id="captureText" maxlength="5000" placeholder="Type an idea, recommendation or useful detail…"></textarea><div class="error" id="formError" hidden>Enter something to capture.</div>
<div class="grid2"><div><label for="source">Source</label><input id="source" type="text" maxlength="120" placeholder="Person, site, podcast…"></div><div><label for="category">Category</label><select class="select" id="category"></select></div></div>
<label for="follow">Follow up</label><input id="follow" type="date"><div class="stamp" id="stamp" hidden></div>
<button class="primary save" id="saveBtn">✓ Save Capture</button><button class="danger" id="deleteBtn" hidden>Delete Capture</button></section></div>

<div class="overlay" id="settingsOverlay"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle"><div class="grab"></div><div class="sheethead"><div><h2 id="settingsTitle">Settings &amp; Data</h2><div class="sub">Simple, local and under your control.</div></div><button class="iconbtn close" id="closeSettings" aria-label="Close">×</button></div>
<div class="settingscard"><h3>Appearance</h3><div class="themegrid"><button class="choice" data-theme-choice="system">System</button><button class="choice" data-theme-choice="light">Light</button><button class="choice" data-theme-choice="dark">Dark</button></div></div>
<div class="settingscard"><h3>Categories</h3><button class="secondary addcat" id="addCategory">＋ Add category</button><div class="chips" id="chips"></div></div>
<div class="settingscard"><h3>Data</h3><div class="datagrid"><button class="secondary" id="exportBtn">⇩ Export backup</button><button class="secondary" id="importBtn">⇧ Import backup</button><input id="importFile" type="file" accept="application/json,.json" hidden></div></div>
<div class="sub" id="about" style="text-align:center;margin-top:14px"></div></section></div>
<div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const KEY='rapid-capture-v1-html',VERSION=1,starter=['Home','Technology','Shopping','Travel','Health','Finance','Work','Personal'];
const $=s=>document.querySelector(s),uid=(p='cap')=>p+'_'+(crypto.randomUUID?crypto.randomUUID():Date.now()+'_'+Math.random().toString(36).slice(2));
const fresh=()=>({schemaVersion:VERSION,revision:0,updatedAt:new Date().toISOString(),captures:[],categories:starter.map((name,order)=>({id:uid('cat'),name,order})),settings:{theme:'system'}});
function valid(v){if(!v||v.schemaVersion!==VERSION||!Array.isArray(v.captures)||!Array.isArray(v.categories))throw Error('Invalid Rapid Capture backup.');v.captures.forEach(x=>{if(!x||typeof x.id!=='string'||typeof x.text!=='string'||!x.createdAt)throw Error('Backup contains an invalid capture.')});return v}
let data;try{data=valid(JSON.parse(localStorage.getItem(KEY))) }catch(e){data=fresh()}let editing=null;
function persist(){data.revision=(data.revision||0)+1;data.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(data));render()}
function applyTheme(){const t=data.settings.theme||'system',dark=t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light';document.querySelectorAll('[data-theme-choice]').forEach(b=>b.classList.toggle('active',b.dataset.themeChoice===t))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fstamp(iso){const d=new Date(iso),n=new Date(),y=new Date();y.setDate(n.getDate()-1);const same=(a,b)=>a.toDateString()===b.toDateString(),time=new Intl.DateTimeFormat(undefined,{hour:'numeric',minute:'2-digit'}).format(d);if(same(d,n))return'Today · '+time;if(same(d,y))return'Yesterday · '+time;return new Intl.DateTimeFormat(undefined,{day:'numeric',month:'short',...(d.getFullYear()!==n.getFullYear()?{year:'numeric'}:{})}).format(d)+' · '+time}
function fdate(v){if(!v)return'';const [y,m,d]=v.split('-').map(Number);return new Intl.DateTimeFormat(undefined,{day:'numeric',month:'short',...(y!==new Date().getFullYear()?{year:'numeric'}:{})}).format(new Date(y,m-1,d))}
function options(){const opts=['<option value="">None</option>',...data.categories.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`)].join('');$('#category').innerHTML=opts;const current=$('#filter').value||'all';$('#filter').innerHTML='<option value="all">All</option><option value="none">Uncategorised</option>'+data.categories.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');if([...$('#filter').options].some(o=>o.value===current))$('#filter').value=current}
function render(){applyTheme();options();const q=$('#search').value.trim().toLowerCase(),f=$('#filter').value||'all',map=Object.fromEntries(data.categories.map(c=>[c.id,c.name]));const shown=[...data.captures].filter(c=>(!q||(c.text+' '+(c.source||'')+' '+(map[c.categoryId]||'')).toLowerCase().includes(q))&&(f==='all'||(f==='none'?!c.categoryId:c.categoryId===f))).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));$('#count').textContent=shown.length+' capture'+(shown.length===1?'':'s');$('#listLabel').textContent=q||f!=='all'?'RESULTS':'RECENT';$('#clearFilters').hidden=!(q||f!=='all');$('#clearSearch').hidden=!q;$('#about').textContent=`Rapid Capture V1.0 · ${data.captures.length} captures · Local browser storage`;
if(shown.length)$('#list').innerHTML='<div class="list">'+shown.map(c=>{const meta=[c.source,map[c.categoryId]].filter(Boolean).join(' · ');return`<button class="row" data-id="${esc(c.id)}"><div class="rowtitle">${esc(c.text)}</div>${meta?`<div class="meta">${esc(meta)}</div>`:''}<div class="rowfoot"><span>${esc(fstamp(c.createdAt))}</span>${c.followUpDate?`<span class="follow">◷ Follow up ${esc(fdate(c.followUpDate))}</span>`:''}</div></button>`}).join('')+'</div>';
else $('#list').innerHTML=`<div class="empty"><div class="emptyicon">＋</div><h2>${data.captures.length?'No captures found':'Nothing captured yet'}</h2><p>${data.captures.length?'Try a different search or clear the category filter.':'Save an idea, recommendation or anything worth remembering.'}</p>${data.captures.length?'':'<button class="primary" id="emptyQuick">Quick Capture</button>'}</div>`;
$('#chips').innerHTML=data.categories.map(c=>`<span class="chip">${esc(c.name)}<button data-delcat="${esc(c.id)}" aria-label="Delete ${esc(c.name)}">×</button></span>`).join('');document.querySelectorAll('.row').forEach(b=>b.onclick=()=>openForm(data.captures.find(c=>c.id===b.dataset.id)));const eq=$('#emptyQuick');if(eq)eq.onclick=()=>openForm();document.querySelectorAll('[data-delcat]').forEach(b=>b.onclick=()=>delCategory(b.dataset.delcat))}
function open(id){$(id).classList.add('open')}function close(id){$(id).classList.remove('open')}function openForm(item=null){editing=item;$('#formTitle').textContent=item?'Edit Capture':'New Capture';$('#formSub').textContent=item?'Update anything you need.':'Save it now. Organise only if useful.';$('#captureText').value=item?.text||'';$('#source').value=item?.source||'';$('#category').value=item?.categoryId||'';$('#follow').value=item?.followUpDate||'';$('#formError').hidden=true;$('#deleteBtn').hidden=!item;$('#stamp').hidden=!item;if(item)$('#stamp').textContent='Captured '+new Intl.DateTimeFormat(undefined,{dateStyle:'medium',timeStyle:'short'}).format(new Date(item.createdAt));open('#captureOverlay');setTimeout(()=>$('#captureText').focus(),150)}
function dirty(){if(!editing)return!!($('#captureText').value||$('#source').value||$('#category').value||$('#follow').value);return $('#captureText').value!==editing.text||$('#source').value!==(editing.source||'')||$('#category').value!==(editing.categoryId||'')||$('#follow').value!==(editing.followUpDate||'')}
function closeForm(){if(dirty()&&!confirm('Discard changes?\n\nYour changes haven’t been saved.'))return;close('#captureOverlay')}
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1700)}
function delCategory(id){const cat=data.categories.find(c=>c.id===id),count=data.captures.filter(c=>c.categoryId===id).length;if(!confirm(`Delete “${cat.name}”?\n\n${count?count+' capture'+(count===1?'':'s')+' will become uncategorised.':'This category is not in use.'}`))return;data.categories=data.categories.filter(c=>c.id!==id);data.captures=data.captures.map(c=>c.categoryId===id?{...c,categoryId:null,updatedAt:new Date().toISOString()}:c);persist()}
$('#quickBtn').onclick=()=>openForm();$('#settingsBtn').onclick=()=>open('#settingsOverlay');$('#closeCapture').onclick=closeForm;$('#closeSettings').onclick=()=>close('#settingsOverlay');$('#captureOverlay').onclick=e=>{if(e.target.id==='captureOverlay')closeForm()};$('#settingsOverlay').onclick=e=>{if(e.target.id==='settingsOverlay')close('#settingsOverlay')};
$('#saveBtn').onclick=()=>{const text=$('#captureText').value.trim();if(!text){$('#formError').hidden=false;$('#captureText').focus();return}const now=new Date().toISOString(),vals={text,source:$('#source').value.trim(),categoryId:$('#category').value||null,followUpDate:$('#follow').value||null};if(editing)data.captures=data.captures.map(c=>c.id===editing.id?{...c,...vals,updatedAt:now}:c);else data.captures.push({id:uid(),...vals,createdAt:now,updatedAt:now});persist();close('#captureOverlay');toast('Captured')};
$('#deleteBtn').onclick=()=>{if(!editing||!confirm('Delete this capture?\n\nThis capture will be permanently removed.'))return;data.captures=data.captures.filter(c=>c.id!==editing.id);persist();close('#captureOverlay');toast('Capture deleted')};
$('#search').oninput=render;$('#filter').onchange=render;$('#clearSearch').onclick=()=>{$('#search').value='';render()};$('#clearFilters').onclick=()=>{$('#search').value='';$('#filter').value='all';render()};
document.querySelectorAll('[data-theme-choice]').forEach(b=>b.onclick=()=>{data.settings.theme=b.dataset.themeChoice;persist()});$('#addCategory').onclick=()=>{const name=prompt('New category name')?.trim();if(!name)return;if(data.categories.some(c=>c.name.toLowerCase()===name.toLowerCase()))return alert('That category already exists.');data.categories.push({id:uid('cat'),name:name.slice(0,50),order:data.categories.length});persist()};
$('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='rapid-capture-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500);toast('Backup exported')};$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{try{const next=valid(JSON.parse(await e.target.files[0].text()));if(!confirm(`Import backup?\n\nThis file contains ${next.captures.length} captures. Your current data will be replaced.`))return;data=next;persist();close('#settingsOverlay');toast('Backup imported')}catch(err){alert(err.message||'Could not import this backup.')}finally{e.target.value=''}};
addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#captureOverlay').classList.contains('open'))closeForm();else close('#settingsOverlay')}});matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(data.settings.theme==='system')applyTheme()});render();
})();
</script>

<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {}));
}
</script>
</body></html>
