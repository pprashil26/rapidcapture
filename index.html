<div class="overlay" id="formOverlay"><div class="sheet"><div class="sheethead"><div><h2 id="formTitle">New Capture</h2><div class="sub">Save it now. Organise only if useful.</div></div><button class="close" data-close="formOverlay">×</button></div><label>What's worth remembering?</label><textarea id="text" maxlength="5000" placeholder="Idea, recommendation or useful information…"></textarea><label>Source</label><input id="source" class="field" placeholder="Person, website, podcast…"><div class="compact-meta"><div><label>Category</label><select id="category"></select></div><div class="calendar-wrap"><label for="follow">Follow-up date</label><button type="button" class="calendar-button" id="calendarButton" aria-label="Choose follow-up date" title="Follow-up date"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="15" rx="2"></rect><path d="M7 3.5v4M17 3.5v4M3.5 9.5h17"></path></svg></button><input type="date" id="follow" aria-label="Follow-up date"></div></div><label class="important-toggle"><input type="checkbox" id="important"> Important</label><button class="primary" id="save">Save Capture</button><button class="danger" id="delete" hidden>Delete Capture</button></div></div>
<div class="overlay" id="filterOverlay"><div class="sheet"><div class="sheethead"><h2>Filter</h2><button class="close" data-close="filterOverlay">×</button></div><div class="filters" id="filterChoices"></div></div></div>
<div class="overlay" id="settingsOverlay"><div class="sheet"><div class="sheethead"><div><h2>Settings & Data</h2><div class="sub">Rapid Capture V1.5</div></div><button class="close" data-close="settingsOverlay">×</button></div><div class="settings"><button id="addCat">+ Add category</button><button id="export">Export JSON backup</button><button id="import">Import JSON backup</button><input id="file" type="file" accept=".json,application/json" hidden></div></div></div>
<script>
(()=>{'use strict';const KEY='rapid-capture-v1-html',cats0=['Home','Technology','Shopping','Travel','Health','Finance','Work','Personal'];const $=s=>document.querySelector(s);let edit=null,filter='all';const uid=(p='cap')=>p+'_'+(crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random());function fresh(){return{schemaVersion:1,revision:0,captures:[],categories:cats0.map((name,order)=>({id:uid('cat'),name,order})),settings:{theme:'system'}}}let data;try{data=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{data=fresh()}function persist(){data.revision=(data.revision||0)+1;localStorage.setItem(KEY,JSON.stringify(data));render()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function ws(d){let x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}function wk(d){return ws(d).toISOString().slice(0,10)}function wl(d){let w=ws(d),n=ws(new Date());if(+w===+n)return'THIS WEEK';let e=new Date(w);e.setDate(e.getDate()+6);let m=x=>new Intl.DateTimeFormat(undefined,{month:'short'}).format(x).toUpperCase();return w.getMonth()===e.getMonth()?`${w.getDate()}–${e.getDate()} ${m(e)}${e.getFullYear()!==new Date().getFullYear()?' '+e.getFullYear():''}`:`${w.getDate()} ${m(w)} – ${e.getDate()} ${m(e)} ${e.getFullYear()}`}function dt(x){let d=new Date(x);return[String(d.getDate()).padStart(2,'0'),new Intl.DateTimeFormat(undefined,{weekday:'short'}).format(d)]}function open(id){$('#'+id).classList.add('open')}function close(id){$('#'+id).classList.remove('open')}function opts(){category.innerHTML='<option value="">None</option>'+data.categories.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}function filters(){filterChoices.innerHTML=[['all','All categories'],['none','Uncategorised'],...data.categories.map(c=>[c.id,c.name])].map(([id,n])=>`<button class="${filter===id?'active':''}" data-f="${esc(id)}">${esc(n)}</button>`).join('');document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f;close('filterOverlay');render()})}function render(){opts();filters();dot.classList.toggle('on',filter!=='all');let q=searchInput.value.trim().toLowerCase(),map=Object.fromEntries(data.categories.map(c=>[c.id,c.name])),a=[...data.captures].filter(c=>(!q||(c.text+' '+(c.source||'')+' '+(map[c.categoryId]||'')).toLowerCase().includes(q))&&(filter==='all'||(filter==='none'?!c.categoryId:c.categoryId===filter))).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));if(!a.length){list.innerHTML=`<div class="empty">${data.captures.length?'No captures found.':'Nothing captured yet. Tap Capture to save something worth remembering.'}</div>`;return}let gs=[];for(let c of a){let k=wk(c.createdAt),g=gs.find(x=>x.k===k);if(!g){g={k,d:new Date(c.createdAt),a:[]};gs.push(g)}g.a.push(c)}list.innerHTML=gs.map(g=>`<section class="week"><h2>${esc(wl(g.d))}</h2>${g.a.map(c=>{let [d,w]=dt(c.createdAt);return`<button class="row ${c.important===true?'important':''}" data-id="${esc(c.id)}"><span class="datebadge"><span class="datenum">${esc(d)}</span><span class="dateday">${esc(w)}</span></span><span class="title">${esc(c.text)}</span><span class="arrow">›</span></button>`}).join('')}</section>`).join('');document.querySelectorAll('.row').forEach(b=>b.onclick=()=>form(data.captures.find(c=>c.id===b.dataset.id)))}function form(c=null){edit=c;formTitle.textContent=c?'Edit Capture':'New Capture';text.value=c?.text||'';source.value=c?.source||'';category.value=c?.categoryId||'';follow.value=c?.followUpDate||'';calendarButton.classList.toggle('has-date',!!follow.value);important.checked=c?.important===true;$('#delete').hidden=!c;open('formOverlay');setTimeout(()=>text.focus(),80)}follow.onchange=()=>calendarButton.classList.toggle('has-date',!!follow.value);captureBtn.onclick=()=>form();searchBtn.onclick=()=>{searchPop.classList.add('open');setTimeout(()=>searchInput.focus(),50)};searchClose.onclick=()=>searchPop.classList.remove('open');searchInput.oninput=render;filterBtn.onclick=()=>{filters();open('filterOverlay')};settings.onclick=()=>open('settingsOverlay');document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>close(b.dataset.close));save.onclick=()=>{let v=text.value.trim();if(!v)return alert('Enter something to capture.');let now=new Date().toISOString(),o={text:v,source:source.value.trim(),categoryId:category.value||null,followUpDate:follow.value||null,important:important.checked===true};if(edit)data.captures=data.captures.map(c=>c.id===edit.id?{...c,...o,updatedAt:now}:c);else data.captures.push({id:uid(),...o,createdAt:now,updatedAt:now});persist();close('formOverlay')};$('#delete').onclick=()=>{if(edit&&confirm('Delete this capture?')){data.captures=data.captures.filter(c=>c.id!==edit.id);persist();close('formOverlay')}};addCat.onclick=()=>{let n=prompt('New category name')?.trim();if(n&&!data.categories.some(c=>c.name.toLowerCase()===n.toLowerCase())){data.categories.push({id:uid('cat'),name:n,order:data.categories.length});persist()}};$('#export').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='rapid-capture-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),500)};$('#import').onclick=()=>$('#file').click();$('#file').onchange=async()=>{try{let x=JSON.parse(await $('#file').files[0].text());if(!Array.isArray(x.captures)||!Array.isArray(x.categories))throw Error();if(confirm('Replace current data with this backup?')){data=x;persist();close('settingsOverlay')}}catch{alert('Invalid backup file.')}$('#file').value=''};render()})();
</script><script>if('serviceWorker'in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));</script></body></html>
